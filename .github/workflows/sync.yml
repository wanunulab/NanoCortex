name: Sync to Lab Org

on:
  push:
    branches:
      - main  

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Lab
        run: |
          #
          REMOTE_URL="https://x-access-token:${{ secrets.SYNC_TOKEN }}@github.com/wanunulab/${{ github.event.repository.name }}.git"
          
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # 
          # 
          git push --force "$REMOTE_URL" main:main
