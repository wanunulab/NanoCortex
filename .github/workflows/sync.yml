name: Sync to Lab Org

on:
  push:
    branches:
      - main

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push to Lab
        run: |
          # 1. 配置身份
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # 2. 核心修正：使用 Token 强制推送
          # 我们把推送命令写得更健壮一些
          git push --force "https://x-access-token:${{ secrets.SYNC_TOKEN }}@github.com/wanunulab/NanoCortex.git" main:main
