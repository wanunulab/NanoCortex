name: Sync to Lab Org

on:
  push:
    branches:
      - main

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false


      - name: Push to Lab
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # 直接把 Token 写在推送命令里，并增加 --force-with-lease 以外的强力模式
          # 确保这里的 SYNC_TOKEN 依然有效
          git push --force "https://meansy0:${{ secrets.SYNC_TOKEN }}@github.com/wanunulab/NanoCortex.git" main:main
